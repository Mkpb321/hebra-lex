<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hebräisch Vokabelsuche</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <label class="search" id="searchWrap" for="searchInput">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0a7 7 0 0114 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input id="searchInput" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Deutsch suchen …" aria-label="Vokabel suchen" />
        <button class="clear-btn" id="clearBtn" type="button" aria-label="Suche löschen">×</button>
      </label>

      <div class="filter-wrap">
        <button class="filter-btn" id="filterButton" type="button" aria-haspopup="true" aria-expanded="false">Kapitel</button>
        <div class="dropdown" id="dropdown" role="dialog" aria-label="Kapitel und Suchoptionen auswählen">
          <div class="dropdown-tools">
            <button class="tool-btn" id="selectAllBtn" type="button">Alle</button>
            <button class="tool-btn" id="selectNoneBtn" type="button">Keine</button>
          </div>

          <div class="dropdown-section">
            <div class="dropdown-section-title">Suche</div>
            <label class="toggle-option" for="fuzzyToggle">
              <input id="fuzzyToggle" type="checkbox" checked />
              <span>Fuzzy Matching</span>
            </label>
            <label class="toggle-option" for="partialToggle">
              <input id="partialToggle" type="checkbox" checked />
              <span>Teiltreffer anzeigen</span>
            </label>
          </div>

          <div class="dropdown-section dropdown-section-lessons">
            <div class="dropdown-section-title">Kapitel</div>
            <div class="lesson-list" id="lessonList"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="resultsHost" class="plain">Lade …</div>
  </div>
</body>
</html>
