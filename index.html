<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Hebräisch" />
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png" />
  <link rel="icon" href="./favicon/favicon.ico" />
  <link rel="manifest" href="./favicon/site.webmanifest" />
  <title>Hebräisch Vokabelsuche</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./hebrew-keyboard.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="searches" aria-label="Suchfelder">
        <label class="search" id="searchWrap" for="searchInput">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0a7 7 0 0114 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="searchInput" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Deutsch suchen …" aria-label="Deutsch suchen" />
          <button class="clear-btn" id="clearBtn" type="button" aria-label="Deutschsuche löschen">×</button>
        </label>

        <label class="search" id="transcriptionSearchWrap" for="transcriptionSearchInput">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0a7 7 0 0114 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="transcriptionSearchInput" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Transkription suchen …" aria-label="Transkription suchen" />
          <button class="clear-btn" id="transcriptionClearBtn" type="button" aria-label="Transkriptionssuche löschen">×</button>
        </label>

        <label class="search" id="hebrewSearchWrap" for="hebrewSearchInput">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0a7 7 0 0114 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="hebrewSearchInput" type="search" inputmode="none" autocomplete="off" spellcheck="false" dir="rtl" placeholder="Hebräisch suchen …" aria-label="Hebräisch suchen" aria-controls="hebrewKeyboardPanel" aria-expanded="false" />
          <button class="clear-btn" id="hebrewClearBtn" type="button" aria-label="Hebräischsuche löschen">×</button>
        </label>
      </div>

      <div class="filter-wrap">
        <button class="filter-btn" id="filterButton" type="button" aria-haspopup="true" aria-expanded="false">Kapitel</button>
        <div class="dropdown" id="dropdown" role="dialog" aria-label="Kapitel auswählen">
          <div class="dropdown-tools">
            <button class="tool-btn" id="selectAllBtn" type="button">Alle</button>
            <button class="tool-btn" id="selectNoneBtn" type="button">Keine</button>
          </div>

          <div class="dropdown-section dropdown-section-lessons">
            <div class="dropdown-section-title">Kapitel</div>
            <div class="lesson-list" id="lessonList"></div>
          </div>
        </div>
      </div>
    </div>



    <section class="hebrew-keyboard-panel" id="hebrewKeyboardPanel" aria-label="Hebräische Tastatur" aria-hidden="true" hidden>
      <div class="hebrew-keyboard" id="hebrewKeyboardKeys" aria-label="Hebräische Zeichen"></div>
    </section>

    <div id="resultsHost" class="plain">Lade …</div>
  </div>
</body>
</html>
